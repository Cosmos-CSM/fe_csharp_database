name: CI

on:
  workflow_dispatch:

  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize]

jobs:
  style_analyze:
    name: Code Analyze
    runs-on: ubuntu-latest

    env: 
      WDIR: csharp_database_extension

    steps: 
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Formatting style
        working-directory: ${{ env.WDIR }}
        run: dotnet format style --verify-no-changes

      - name: Formatting analyzer
        working-directory: ${{ env.WDIR }}
        run: dotnet format analyzers --verify-no-changes

  unit_testing:
    name: Unit Testing
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    env:
      WDIR: csharp_database_extension
      TEST_PROJECT: "Unit Tests/Unit Tests.csproj"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure NuGet (GitHub Packages)
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PUBLISH_PAT }}
        run: |
          dotnet nuget add source \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username ${{ github.actor }} \
            --password "$NUGET_AUTH_TOKEN" \
            --store-password-in-clear-text

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        working-directory: ${{ env.WDIR }}
        run: dotnet restore

      - name: Build with analyzers
        working-directory: ${{ env.WDIR }}
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Run tests
        working-directory: ${{ env.WDIR }}
        run: dotnet test "$TEST_PROJECT" --no-build --configuration Release --verbosity normal

  code_analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure NuGet (GitHub Packages)
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PUBLISH_PAT }}
        run: |
          dotnet nuget add source \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username ${{ github.actor }} \
            --password "$NUGET_AUTH_TOKEN" \
            --store-password-in-clear-text

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        
      - name: Dependency Review (security)
        uses: actions/dependency-review-action@v4
