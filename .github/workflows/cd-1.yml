name: CD 1

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:

  validate-source:
    name: Validate Source Branch
    runs-on: ubuntu-latest

    steps:
      - name: Prevent Sources
        run: |
          set -euo pipefail
          HEAD_REF="${{ github.head_ref }}"
          echo "Head Branch: $HEAD_REF"

          if [ "$HEAD_REF" = "dev" ]; then
            echo "Cannot merge into main from dev branch"
            exit 1
          fi

          if [[ "$HEAD_REF" =~ ^vbump_[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "Name matches version bump"
            exit 0
          else
            echo "Wrong source. Expected: vbump_{version}"
            exit 1
          fi

  compare-versions:
    needs: validate-source
    name: Compare Versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package_metadata.outputs.version }}
      packages: ${{ steps.package_metadata.outputs.packages }}

    steps:
      - name: CheckOut Base
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: CheckOut Head
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: head

      - name: Read Base version
        id: base_version
        run: |
          VERSION=$(jq -r '.version' base/csmpackage.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Read Head version
        id: head_version
        run: |
          VERSION=$(jq -r '.version' head/csmpackage.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Compare versions
        run: |
          set -euo pipefail

          BASE="${{ steps.base_version.outputs.version }}"
          HEAD="${{ steps.head_version.outputs.version }}"
          BRANCH="${{ github.head_ref }}"
          REGEX='^vbump[_-]([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z._-]+)?(\+[0-9A-Za-z._-]+)?)$'

          echo "Base version: $BASE"
          echo "Head version: $HEAD"
          echo "Head Branch: $BRANCH"

          if [ "$BASE" = "$HEAD" ]; then
            echo "Package metadata version isn't bumped"
            exit 1
          fi

          if [[ $BRANCH =~ $REGEX ]]; then
            BRANCH_VER="${BASH_REMATCH[1]}"
            echo "Extracted version from branch: $BRANCH_VER"
          else
            echo "Branch name does not match required pattern: vbump_{version} or vbump-{version}"
            echo "Examples: vbump_1.2.3, vbump-1.2.3-alpha, vbump_1.2.3+build.1"
            exit 1
          fi

          if [ "$BRANCH_VER" = "$HEAD" ]; then
            echo "Version match"
          else
            echo "Version mismatch: branch has '$BRANCH_VER' but metadata is '$HEAD'"
            exit 1
          fi

          echo "Versions bumped correctly"

      - name: Expose Package Metadata
        id: package_metadata
        run: |
          VERSION=$(jq -r '.version' head/csmpackage.json)
          PACKAGES_JSON=$(jq -c '.packages' head/csmpackage.json)

          printf '%s\n' "version=$VERSION" >> $GITHUB_OUTPUT
          printf '%s\n' "packages=$PACKAGES_JSON" >> $GITHUB_OUTPUT

  generate_release_docs:
    name: Generate Release Documentation (Release-Notes & Changelog)
    needs: compare-versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.compare-versions.outputs.packages) }}
    steps:
      - name: CheckOut Head branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: SetUp GitHub Access
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Prevent Looping
        run: |
          set -euo pipefail

          AUTO_NAME="github-actions"
          AUTO_EMAIL="github-actions@github.com"
          AUTO_COMMIT_MARKER="Generated vdocs."

          last_name=$(git log -1 --pretty=format:'%an')
          last_email=$(git log -1 --pretty=format:'%ae')
          last_message=$(git log -1 --pretty=format:'%s')

          echo "Last commit author: $last_name <$last_email>"
          echo "Last commit message: $last_message"

          if [ "$last_name" = "$AUTO_NAME" ] || [ "$last_email" = "$AUTO_EMAIL" ] || echo "$last_message" | grep -qF "$AUTO_COMMIT_MARKER"; then
            echo "Skipping generate_release_docs: last commit created by automation."
            exit 0
          fi
        shell: bash

      - name: Prepare Package Metadata
        run: |
          echo "PACKAGE='${{ matrix.package }}'"
          echo "VERSION='${{ needs.compare-versions.outputs.version }}'"
        shell: bash

      - name: Build PR Summary
        id: pr_summary
        run: |
          |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"

          echo "Fetching PR metadata for #$PR_NUMBER"

          PR_DATA=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER") || true

          TITLE=$(echo "$PR_DATA" | jq -r '.title // "No title"')
          BODY=$(echo "$PR_DATA" | jq -r '.body // "No description provided."')
          AUTHOR=$(echo "$PR_DATA" | jq -r '.user.login // "unknown"')
          LABELS=$(echo "$PR_DATA" | jq -r '(.labels // []) | map(.name) | join(", ")')

          FILES_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/files") || true
          FILES=$(echo "$FILES_JSON" | jq -r '.[].filename' || true)

          COMMITS_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/commits") || true
          COMMITS=$(echo "$COMMITS_JSON" | jq -r '.[].commit.message' || true)

          SUMMARY_FILE="pr_summary.md"

          {
            echo "### PR Summary"
            echo ""
            echo "**Title:** $TITLE"
            echo ""
            echo "**Author:** @$AUTHOR"
            echo ""
            echo "**Description:**"
            echo ""
            echo "$BODY"
            echo ""
            if [ -n "$LABELS" ]; then
              echo "**Labels:** $LABELS"
            else
              echo "**Labels:** None"
            fi
            echo ""
            echo "### Changes"
            echo ""
            echo "**Files modified:**"
            if [ -n "$FILES" ]; then
              echo "$FILES" | sed 's/^/- /'
            else
              echo "- (no file list available)"
            fi
            echo ""
            echo "**Commits:**"
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS" | sed 's/^/- /'
            else
              echo "- (no commits available)"
            fi
            echo ""
            echo "### Notes"
            echo ""
            echo "- Generated from PR metadata: title, body, labels, files, commits."
          } > "$SUMMARY_FILE"

          echo "summary_path=$SUMMARY_FILE" >> $GITHUB_OUTPUT
        shell: bash