name: CD 1

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:

  validate-source:
    name: Validate Source Branch
    runs-on: ubuntu-latest

    steps:
      - name: Prevent Sources
        run: |
          set -euo pipefail
          HEAD_REF="${{ github.head_ref }}"
          echo "Head Branch: $HEAD_REF"

          if [ "$HEAD_REF" = "dev" ]; then
            echo "Cannot merge into main from dev branch"
            exit 1
          fi

          if [[ "$HEAD_REF" =~ ^vbump_[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "Name matches version bump"
            exit 0
          else
            echo "Wrong source. Expected: vbump_{version}"
            exit 1
          fi

  compare-versions:
    needs: validate-source
    name: Compare Versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package_metadata.outputs.version }}
      packages: ${{ steps.package_metadata.outputs.packages }}

    steps:
      - name: CheckOut Base
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: CheckOut Head
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: head

      - name: Read Base version
        id: base_version
        run: |
          VERSION=$(jq -r '.version' base/csmpackage.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Read Head version
        id: head_version
        run: |
          VERSION=$(jq -r '.version' head/csmpackage.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Compare versions
        run: |
          set -euo pipefail

          BASE="${{ steps.base_version.outputs.version }}"
          HEAD="${{ steps.head_version.outputs.version }}"
          BRANCH="${{ github.head_ref }}"
          REGEX='^vbump[_-]([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z._-]+)?(\+[0-9A-Za-z._-]+)?)$'

          echo "Base version: $BASE"
          echo "Head version: $HEAD"
          echo "Head Branch: $BRANCH"

          if [ "$BASE" = "$HEAD" ]; then
            echo "Package metadata version isn't bumped"
            exit 1
          fi

          if [[ $BRANCH =~ $REGEX ]]; then
            BRANCH_VER="${BASH_REMATCH[1]}"
            echo "Extracted version from branch: $BRANCH_VER"
          else
            echo "Branch name does not match required pattern: vbump_{version} or vbump-{version}"
            echo "Examples: vbump_1.2.3, vbump-1.2.3-alpha, vbump_1.2.3+build.1"
            exit 1
          fi

          if [ "$BRANCH_VER" = "$HEAD" ]; then
            echo "Version match"
          else
            echo "Version mismatch: branch has '$BRANCH_VER' but metadata is '$HEAD'"
            exit 1
          fi

          echo "Versions bumped correctly"

      - name: Expose Package Metadata
        id: package_metadata
        run: |
          VERSION=$(jq -r '.version' head/csmpackage.json)
          PACKAGES_JSON=$(jq -c '.packages' head/csmpackage.json)

          printf '%s\n' "version=$VERSION" >> $GITHUB_OUTPUT
          printf '%s\n' "packages=$PACKAGES_JSON" >> $GITHUB_OUTPUT

  generate_release_docs:
    name: Generate Release Documentation (Release-Notes & Changelog)
    needs: compare-versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.compare-versions.outputs.packages) }}
    
    steps:
      - name: CheckOut Head branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: SetUp GitHub Access
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Prevent Looping
        run: |
          set -euo pipefail

          AUTO_NAME="github-actions"
          AUTO_EMAIL="github-actions@github.com"
          AUTO_COMMIT_MARKER="Generated vdocs."

          last_name=$(git log -1 --pretty=format:'%an')
          last_email=$(git log -1 --pretty=format:'%ae')
          last_message=$(git log -1 --pretty=format:'%s')

          echo "Last commit author: $last_name <$last_email>"
          echo "Last commit message: $last_message"

          if [ "$last_name" = "$AUTO_NAME" ] || [ "$last_email" = "$AUTO_EMAIL" ] || echo "$last_message" | grep -qF "$AUTO_COMMIT_MARKER"; then
            echo "Skipping generate_release_docs: last commit created by automation."
            exit 0
          fi
        shell: bash

      - name: Prepare Package Metadata
        run: |
          echo "PACKAGE='${{ matrix.package }}'"
          echo "VERSION='${{ needs.compare-versions.outputs.version }}'"
        shell: bash

      - name: Build PR Summary
        id: pr_summary
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"

          echo "Fetching PR metadata for #$PR_NUMBER"

          PR_DATA=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER") || true

          TITLE=$(echo "$PR_DATA" | jq -r '.title // "No title"')
          BODY=$(echo "$PR_DATA" | jq -r '.body // "No description provided."')
          AUTHOR=$(echo "$PR_DATA" | jq -r '.user.login // "unknown"')
          LABELS=$(echo "$PR_DATA" | jq -r '(.labels // []) | map(.name) | join(", ")')

          FILES_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/files") || true
          FILES=$(echo "$FILES_JSON" | jq -r '.[].filename' || true)

          COMMITS_JSON=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/commits") || true
          COMMITS=$(echo "$COMMITS_JSON" | jq -r '.[].commit.message' || true)

          SUMMARY_FILE="pr_summary.md"

          {
            echo "### PR Summary"
            echo ""
            echo "**Title:** $TITLE"
            echo ""
            echo "**Author:** @$AUTHOR"
            echo ""
            echo "**Description:**"
            echo ""
            echo "$BODY"
            echo ""
            if [ -n "$LABELS" ]; then
              echo "**Labels:** $LABELS"
            else
              echo "**Labels:** None"
            fi
            echo ""
            echo "### Changes"
            echo ""
            echo "**Files modified:**"
            if [ -n "$FILES" ]; then
              echo "$FILES" | sed 's/^/- /'
            else
              echo "- (no file list available)"
            fi
            echo ""
            echo "**Commits:**"
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS" | sed 's/^/- /'
            else
              echo "- (no commits available)"
            fi
            echo ""
            echo "### Notes"
            echo ""
            echo "- Generated from PR metadata: title, body, labels, files, commits."
          } > "$SUMMARY_FILE"

          echo "summary_path=$SUMMARY_FILE" >> $GITHUB_OUTPUT
        shell: bash

      - name: Generate release notes and update CHANGELOG
        id: gen_docs
        run: |
          set -euo pipefail

          PACKAGE="${{ matrix.package }}"
          VERSION="${{ needs.compare-versions.outputs.version }}"
          SUMMARY_PATH="${{ steps.pr_summary.outputs.summary_path }}"

          PACKAGE_PATH="$PACKAGE"
          RELEASE_DIR="$PACKAGE_PATH/release-notes"
          RELEASE_FILE="$RELEASE_DIR/v${VERSION}.md"

          mkdir -p "$RELEASE_DIR"

          {
            echo "## Release $VERSION"
            echo ""
            if [ -f "$SUMMARY_PATH" ]; then
              cat "$SUMMARY_PATH"
            else
              echo "- No PR summary available."
            fi
            echo ""
          } > "$RELEASE_FILE"

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "- Unable to determine commit range." >> "$RELEASE_FILE"
          else
            if [ "$(git rev-list --count "$BASE_SHA..$HEAD_SHA")" -eq 0 ]; then
              echo "- No commits detected between base and head." >> "$RELEASE_FILE"
            else
              echo "" >> "$RELEASE_FILE"
              git --no-pager log --pretty=format:"- %s (%an)" "$BASE_SHA..$HEAD_SHA" >> "$RELEASE_FILE"
            fi
          fi

          # Ensure CHANGELOG exists at package root
          CHANGELOG_FILE="$PACKAGE_PATH/CHANGELOG"
          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "# Changelog" > "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
          fi

          NEW_ENTRY_FILE="$(mktemp)"
          {
            echo "## v${VERSION}"
            echo ""
            if [ -f "$SUMMARY_PATH" ]; then
              cat "$SUMMARY_PATH"
            else
              echo "- No PR summary available."
            fi
            echo ""
            echo "### Commits"
            if [ -n "$HEAD_SHA" ] && [ -n "$BASE_SHA" ]; then
              git --no-pager log --pretty=format:"- %s (%an)" "$BASE_SHA..$HEAD_SHA"
            fi
            echo ""
          } > "$NEW_ENTRY_FILE"

          # Replace or prepend entry
          if grep -qE "^## v${VERSION}\b" "$CHANGELOG_FILE"; then
            awk -v ver="v${VERSION}" -v newfile="$NEW_ENTRY_FILE" '
              BEGIN {
                replaced = 0;
                while ((getline line < newfile) > 0) {
                  newlines = newlines line "\n"
                }
                close(newfile)
              }
              {
                if ($0 ~ "^## " ver "\\b") {
                  printf "%s", newlines
                  replaced = 1
                  while (getline > 0) {
                    if ($0 ~ "^## v[0-9]+") {
                      print $0
                      break
                    }
                  }
                  next
                }
                print $0
              }
              END {
              }
            ' "$CHANGELOG_FILE" > "${CHANGELOG_FILE}.tmp" || true

            if [ -s "${CHANGELOG_FILE}.tmp" ]; then
              mv "${CHANGELOG_FILE}.tmp" "$CHANGELOG_FILE"
            else
              cat "$NEW_ENTRY_FILE" "$CHANGELOG_FILE" > "${CHANGELOG_FILE}.tmp"
              mv "${CHANGELOG_FILE}.tmp" "$CHANGELOG_FILE"
            fi
          else
            if head -n1 "$CHANGELOG_FILE" | grep -qE '^#\s+Changelog'; then
              tail -n +2 "$CHANGELOG_FILE" > "${CHANGELOG_FILE}.body.tmp"
              { head -n1 "$CHANGELOG_FILE"; echo ""; cat "$NEW_ENTRY_FILE"; echo ""; cat "${CHANGELOG_FILE}.body.tmp"; } > "${CHANGELOG_FILE}.tmp"
              mv "${CHANGELOG_FILE}.tmp" "$CHANGELOG_FILE"
              rm -f "${CHANGELOG_FILE}.body.tmp"
            else
              cat "$NEW_ENTRY_FILE" "$CHANGELOG_FILE" > "${CHANGELOG_FILE}.tmp"
              mv "${CHANGELOG_FILE}.tmp" "$CHANGELOG_FILE"
            fi
          fi

          rm -f "$NEW_ENTRY_FILE"

          # Expose whether there are changes to commit
          if git status --porcelain | grep -q .; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Post release notes as PR comment (works for forks)
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUM=${{ github.event.pull_request.number }}
          REPO="${{ github.repository }}"
          PACKAGE="${{ matrix.package }}"
          VERSION="${{ needs.compare-versions.outputs.version }}"
          RELEASE_FILE="${PACKAGE}/release-notes/v${VERSION}.md"

          if [ -f "$RELEASE_FILE" ]; then
            # Use jq -Rs to safely encode the file content into JSON string
            BODY_JSON=$(jq -Rs --arg title "Release notes for ${PACKAGE} v${VERSION}" '{body: (. | "\n" + .)}' < "$RELEASE_FILE")
            curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues/${PR_NUM}/comments" \
              -d "$BODY_JSON" > /dev/null || true
            echo "Posted release notes as PR comment."
          else
            echo "Release file not found; skipping PR comment."
          fi
        shell: bash

      - name: Commit Generated vdocs (only when PR branch is in same repo)
        if: steps.gen_docs.outputs.changes == 'true' && (github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GIT_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "Generated vdocs."

          # Ensure remote URL uses token for authentication
          REPO_URL="$(git remote get-url origin)"
          AUTH_REMOTE="${REPO_URL/https:\/\/github.com\//https:\/\/${GIT_PUSH_TOKEN}@github.com/}"
          git remote set-url origin "$AUTH_REMOTE"

          git push origin "HEAD:${TARGET_BRANCH}"
        shell: bash

      - name: No changes to commit
        if: steps.gen_docs.outputs.changes == 'false'
        run: echo "No release docs changes detected; nothing to commit."
